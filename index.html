<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сканворд</title>
<meta name="description" content="Український сканворд: 100 рівнів, сканворд дня, працює без інтернету.">
<link rel="stylesheet" href="style.css">

<!-- Installable web app: added to the home screen, launched without
     browser chrome, and playable with no connection at all. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2e7d46">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<!-- iOS ignores the manifest for standalone launch and needs these. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Сканворд">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>

  <div class="header">
    <div class="eyebrow">Сканворд · українською</div>
    <h1>Сканворд</h1>
    <p class="sub">Кожна клітинка — підказка або літера. Клікни на підказку, щоб перейти до слова, або на літеру, щоб почати вписувати відповідь.</p>
  </div>

  <div id="homeScreen">
    <nav class="home-menu">
      <button class="home-btn home-btn-primary" id="playBtn">
        <span class="home-btn-label">Грати</span>
        <span class="home-btn-sub" id="homePlaySub">100 рівнів</span>
      </button>
      <button class="home-btn" id="dailyBtn">
        <span class="home-btn-label">Сканворд дня</span>
        <span class="home-btn-sub" id="homeDailySub">—</span>
      </button>
      <button class="home-btn" id="optionsBtn" disabled>
        <span class="home-btn-label">Налаштування</span>
        <span class="home-btn-sub">незабаром</span>
      </button>
      <button class="home-btn" id="rulesBtn" disabled>
        <span class="home-btn-label">Правила</span>
        <span class="home-btn-sub">незабаром</span>
      </button>
    </nav>
  </div>

  <div id="menuScreen" hidden>
    <div class="play-head">
      <button class="btn-ghost btn-back" id="levelsBackBtn">← Меню</button>
      <span class="play-title">Рівні</span>
    </div>

    <div class="progress-summary">
      <span class="progress-stars">★</span>
      <span id="totalStars">0</span><span class="progress-of">/</span><span id="maxStars">0</span>
      <span class="progress-sub" id="progressSub"></span>
    </div>

    <div class="ladder" id="ladder"></div>

    <details class="custom-settings">
      <summary>Швидка гра або своя сітка</summary>
      <div class="settings">
        <span class="settings-label">Випадковий:</span>
        <button class="btn-primary" id="easyBtn">Легкий</button>
        <button class="btn-primary" id="mediumBtn">Середній</button>
        <button class="btn-primary" id="hardBtn">Складний</button>
      </div>
      <div class="settings">
        <label>Рядків <input type="number" id="rowsInput" value="6" min="5" max="10"></label>
        <label>Колонок <input type="number" id="colsInput" value="6" min="5" max="10"></label>
        <button class="btn-primary" id="generateBtn">Згенерувати</button>
      </div>
    </details>
  </div>

  <div id="playScreen" hidden>

  <div class="play-head">
    <button class="btn-ghost btn-back" id="backBtn">←</button>
    <span class="play-title" id="playTitle"></span>
    <span class="play-badge" id="dailyBadge" hidden></span>
  </div>

  <div class="statsbar" id="statsbar" hidden>
    <div class="stat"><span class="stat-label">Час</span><span class="stat-value" id="timerValue">0:00</span></div>
    <div class="stat"><span class="stat-label">Ціль</span><span class="stat-value" id="parValue">—</span></div>
    <div class="stat"><span class="stat-label">Підказки</span><span class="stat-value" id="hintsValue">0</span></div>
  </div>

  <div class="grid-wrap">
    <div class="grid" id="grid"></div>
  </div>

  <div class="controls">
    <button class="btn-primary" id="checkBtn">Перевірити</button>
    <button class="btn-ghost" id="hintBtn">Підказка</button>
    <button class="btn-ghost" id="resetBtn">Спочатку</button>
  </div>
  <div class="status" id="status"></div>

  <div class="results" id="results" hidden>
    <div class="results-stars" id="resultsStars"></div>
    <div class="results-perfect" id="resultsPerfect" hidden>ІДЕАЛЬНО</div>
    <div class="results-points"><span id="resultsPoints">0</span> <span class="results-points-label">очок</span></div>
    <div class="results-meta" id="resultsMeta"></div>
    <div class="results-best" id="resultsBest" hidden></div>
    <div class="results-actions">
      <button class="btn-primary" id="nextLevelBtn" hidden>Наступний рівень →</button>
      <button class="btn-ghost" id="toMenuBtn">До рівнів</button>
    </div>
  </div>

  </div><!-- /playScreen -->

  <!-- data/dictionary.js is NOT loaded here on purpose: it is ~1MB, more
       than half the app's payload, and only the custom-grid generator
       needs it. js/app.js pulls it in on demand the first time someone
       generates their own grid; the 100 levels and the daily play fine
       without it. -->
  <script src="js/grid-skeleton.js"></script>
  <script src="js/word-filler.js"></script>
  <script src="js/generator.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/daily.js"></script>
  <script src="js/app.js"></script>

  <script>
    // Registered after load so fetching the worker (and the ~800K it
    // precaches) never competes with rendering the first screen.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch((err) => console.warn("SW registration failed", err));
      });
    }
  </script>
</body>
</html>
